<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestroGenie POS</title>
<style>
:root{--sb:#1e293b;--sb2:#0f172a;--ac:#059669;--ac2:#047857;--bg:#f1f5f9;--card:#fff;--txt:#1e293b;--mut:#64748b;--bdr:#e2e8f0;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--ok-bg:#dcfce7;--warn-bg:#fef3c7;--err-bg:#fee2e2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);display:flex;height:100vh;overflow:hidden}
/* ===== SIDEBAR ===== */
#sidebar{width:220px;min-width:220px;background:var(--sb2);display:flex;flex-direction:column;overflow-y:auto}
.sb-brand{padding:20px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px}
.sb-brand .logo{width:36px;height:36px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sb-brand .name{color:#f8fafc;font-weight:700;font-size:15px;line-height:1.2}
.sb-brand .sub{color:#94a3b8;font-size:11px}
.sb-section{padding:12px 8px 4px;color:#475569;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-radius:8px;margin:2px 8px;color:#94a3b8;font-size:13.5px;transition:.15s;border:none;background:none;width:calc(100% - 16px);text-align:left}
.nav-item:hover{background:#1e293b;color:#e2e8f0}
.nav-item.active{background:var(--ac);color:#fff}
.nav-item .ic{font-size:16px;width:20px;text-align:center}
/* ===== MAIN ===== */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--card);border-bottom:1px solid var(--bdr);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#topbar .page-title{font-weight:700;font-size:18px}
#topbar .meta{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:16px}
#content{flex:1;overflow-y:auto;padding:24px}
/* ===== CARDS ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-stat{display:flex;flex-direction:column;gap:4px}
.card-stat .label{font-size:12px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.card-stat .value{font-size:26px;font-weight:700;color:var(--txt)}
.card-stat .change{font-size:12px;color:var(--mut)}
.card-stat .ic{font-size:28px;margin-bottom:8px}
/* ===== SECTION HEADERS ===== */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-hdr h2{font-size:16px;font-weight:700}
/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn-primary{background:var(--ac);color:#fff}.btn-primary:hover{background:var(--ac2)}
.btn-success{background:var(--ok);color:#fff}
.btn-danger{background:var(--err);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--bdr);color:var(--txt)}.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:6px}
/* ===== TABLES ===== */
.tbl-wrap{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:10px 14px;text-align:left;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bdr)}
td{padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--bdr)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
/* ===== FORMS ===== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
label{font-size:12px;font-weight:600;color:var(--mut)}
input,select,textarea{padding:9px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-size:13.5px;color:var(--txt);background:var(--card);transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.toggle-wrap{display:flex;align-items:center;gap:10px;padding:8px 0}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:12px;transition:.3s}
.slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--ac)}
.toggle input:checked+.slider:before{transform:translateX(20px)}
/* ===== BADGES ===== */
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge-veg{background:#dcfce7;color:#16a34a}.badge-nonveg{background:#fee2e2;color:#dc2626}
.badge-ok{background:var(--ok-bg);color:var(--ok)}.badge-warn{background:var(--warn-bg);color:var(--warn)}.badge-err{background:var(--err-bg);color:var(--err)}
.badge-paid{background:#dcfce7;color:#16a34a}.badge-unpaid{background:var(--warn-bg);color:var(--warn)}.badge-cancelled{background:#f1f5f9;color:var(--mut)}
/* ===== SEARCH ===== */
.search-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-input{padding:8px 14px;border:1.5px solid var(--bdr);border-radius:8px;font-size:13px;min-width:200px;outline:none}
.search-input:focus{border-color:var(--ac)}
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat-tab{padding:6px 14px;border-radius:999px;border:1.5px solid var(--bdr);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.cat-tab.active,.cat-tab:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
/* ===== BILLING SCREEN ===== */
#billing-wrap{display:grid;grid-template-columns:1fr 380px;gap:0;height:calc(100vh - 56px);overflow:hidden}
#menu-panel{overflow-y:auto;padding:16px;background:var(--bg);border-right:1px solid var(--bdr)}
#order-panel{background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.menu-card{background:var(--card);border-radius:10px;padding:12px;cursor:pointer;border:2px solid transparent;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.menu-card:hover{border-color:var(--ac);transform:translateY(-1px)}
.menu-card.unavail{opacity:.5;cursor:not-allowed}
.menu-card .mc-name{font-weight:600;font-size:14px;margin-bottom:4px;line-height:1.3}
.menu-card .mc-price{color:var(--ac);font-weight:700;font-size:15px}
.menu-card .mc-cat{color:var(--mut);font-size:11px}
.menu-card .mc-veg{width:14px;height:14px;border:1.5px solid currentColor;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;margin-right:4px}
.mc-veg.veg{color:var(--ok)}.mc-veg.nv{color:var(--err)}
.mc-veg::after{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
/* Order panel */
.op-hdr{padding:12px 16px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.op-hdr input,.op-hdr select{width:100%;padding:8px 10px;font-size:13px;margin-bottom:8px}
.otype-btns{display:flex;gap:6px}
.otype-btns .otype-btn{flex:1;text-align:center;white-space:nowrap}
.otype-btn{padding:5px 12px;border-radius:6px;border:1.5px solid var(--bdr);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.otype-btn.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.op-items{flex:1;overflow-y:auto;padding:8px 16px}
.op-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bdr)}
.op-item:last-child{border-bottom:none}
.oi-name{flex:1;font-size:13px;font-weight:600;min-width:0}
.oi-cat{font-size:11px;color:var(--mut)}
.qty-ctrl{display:flex;align-items:center;gap:4px}
.qty-btn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.15s}
.qty-btn.minus{background:var(--err-bg);color:var(--err)}.qty-btn.minus:hover{background:var(--err);color:#fff}
.qty-btn.plus{background:var(--ok-bg);color:var(--ok)}.qty-btn.plus:hover{background:var(--ok);color:#fff}
.qty-val{width:28px;text-align:center;font-weight:700;font-size:14px}
.oi-amt{font-weight:700;font-size:13px;min-width:70px;text-align:right}
.oi-del{background:none;border:none;color:var(--mut);cursor:pointer;padding:4px;border-radius:4px}.oi-del:hover{color:var(--err)}
.op-empty{text-align:center;padding:40px 20px;color:var(--mut)}
.op-empty .icon{font-size:40px;margin-bottom:12px}
.op-totals{padding:12px 16px;border-top:1px solid var(--bdr);background:#f8fafc;flex-shrink:0}
.tot-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--mut)}
.tot-row.grand{font-size:16px;font-weight:700;color:var(--txt);padding-top:8px;margin-top:4px;border-top:2px dashed var(--bdr)}
.discount-row{display:flex;align-items:center;gap:6px;margin:6px 0}
.discount-row input{width:80px;padding:5px 8px;font-size:12px}
.discount-row select{padding:5px 8px;font-size:12px;width:70px}
.op-footer{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.pay-modes{display:flex;gap:6px;flex-wrap:wrap}
.pay-btn{padding:5px 12px;border-radius:6px;border:1.5px solid var(--bdr);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.pay-btn.active{background:var(--sb);color:#fff;border-color:var(--sb)}
.action-btns{display:flex;gap:8px}
.action-btns .btn{flex:1;justify-content:center;padding:10px}
/* ===== STOCK ===== */
.stock-status{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.s-ok{background:var(--ok)}.s-warn{background:var(--warn)}.s-err{background:var(--err)}
/* ===== REPORT ===== */
.report-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.rc{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rc .rl{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.rc .rv{font-size:22px;font-weight:700}
.rc .rsub{font-size:12px;color:var(--mut);margin-top:2px}
/* ===== TOAST ===== */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1e293b;color:#f8fafc;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:500;pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:240px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideIn .3s ease}
.toast.ok{border-left:4px solid var(--ok)}.toast.err{border-left:4px solid var(--err)}.toast.warn{border-left:4px solid var(--warn)}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:14px;padding:24px;min-width:360px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-hdr h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* ===== MISC ===== */
.page-header{margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.page-header p{color:var(--mut);font-size:14px}
.empty-state{text-align:center;padding:60px 20px;color:var(--mut)}
.empty-state .ei{font-size:48px;margin-bottom:12px}
.profit-pos{color:var(--ok);font-weight:600}
.profit-neg{color:var(--err);font-weight:600}
.progress-bar{height:8px;background:var(--bdr);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--ac);border-radius:4px;transition:.5s}
.divider{height:1px;background:var(--bdr);margin:16px 0}
/* ===== SETTINGS ===== */
.settings-section{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
/* ===== ONLINE ORDERS ===== */
.nav-badge{margin-left:auto;background:var(--err);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.kcol{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);min-height:120px}
.kcol-hdr{padding:10px 12px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--bdr)}
.kcol-body{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 230px);overflow-y:auto}
.ocard{border:1px solid var(--bdr);border-radius:10px;padding:10px;font-size:12.5px;transition:.15s;border-left:4px solid var(--mut)}
.ocard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ocard.ch-Swiggy{border-left-color:#fc8019}
.ocard.ch-Zomato{border-left-color:#e23744}
.ocard.ch-Phone{border-left-color:#0ea5e9}
.ocard.ch-Website{border-left-color:#16a34a}
.ocard .oc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ocard .oc-ch{font-weight:700;font-size:11px;padding:2px 7px;border-radius:6px;color:#fff}
.oc-ch.Swiggy{background:#fc8019}.oc-ch.Zomato{background:#e23744}.oc-ch.Phone{background:#0ea5e9}.oc-ch.Website{background:#16a34a}
.ocard .oc-items{color:var(--mut);font-size:11.5px;margin:4px 0;line-height:1.4}
.ocard .oc-total{font-weight:700;font-size:14px}
.ocard .oc-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.chan-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.chan-chip.Swiggy{background:#fc8019}.chan-chip.Zomato{background:#e23744}.chan-chip.Phone{background:#0ea5e9}.chan-chip.Website{background:#16a34a}.chan-chip.Counter{background:#64748b}

/* ===== PRINT ===== */
@media print{
  body>*{display:none!important}
  #print-area{display:block!important;position:fixed;inset:0}
  #print-area *{display:block}
}
#print-area{display:none}
.bill-paper{width:302px;font-family:'Courier New',monospace;font-size:12px;line-height:1.4;padding:8px;background:#fff;color:#000;margin:0 auto}
.bill-center{text-align:center}
.bill-name{font-size:16px;font-weight:bold;margin-bottom:2px}
.bill-sub{font-size:11px;margin:1px 0}
.bill-dash{border:none;border-top:1px dashed #000;margin:6px 0}
.bill-row{display:flex;justify-content:space-between;font-size:12px;margin:1px 0}
.bill-row.hdr{font-weight:bold;border-bottom:1px dashed #000;padding-bottom:3px;margin-bottom:3px}
.bill-grand{display:flex;justify-content:space-between;font-size:14px;font-weight:bold;border-top:1px dashed #000;border-bottom:1px dashed #000;padding:4px 0;margin:4px 0}
.bill-footer{text-align:center;font-size:11px;margin-top:8px}
.kot-paper{width:302px;font-family:'Courier New',monospace;padding:10px;background:#fff;color:#000}
.kot-title{font-size:22px;font-weight:bold;text-align:center;margin-bottom:8px;border-bottom:3px solid #000;padding-bottom:6px}
.kot-table{font-size:20px;font-weight:bold;text-align:center;margin:6px 0}
.kot-item{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;padding:6px 0;border-bottom:1px dashed #000}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-brand">
    <div class="logo">🍽️</div>
    <div>
      <div class="name" id="sb-rname">RestroGenie</div>
      <div class="sub" id="sb-date"></div>
    </div>
  </div>
  <div class="sb-section">Main</div>
  <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><span class="ic">📊</span> Dashboard</button>
  <button class="nav-item" data-page="billing" onclick="navigate('billing')"><span class="ic">💰</span> New Bill</button>
  <button class="nav-item" data-page="online" onclick="navigate('online')"><span class="ic">🛵</span> Online Orders <span class="nav-badge" id="online-badge" style="display:none">0</span></button>
  <div class="sb-section">Manage</div>
  <button class="nav-item" data-page="menu" onclick="navigate('menu')"><span class="ic">🍛</span> Menu Items</button>
  <button class="nav-item" data-page="stock" onclick="navigate('stock')"><span class="ic">📦</span> Stock</button>
  <div class="sb-section">Reports</div>
  <button class="nav-item" data-page="history" onclick="navigate('history')"><span class="ic">🧾</span> Order History</button>
  <button class="nav-item" data-page="sales" onclick="navigate('sales')"><span class="ic">📋</span> Sales Report</button>
  <button class="nav-item" data-page="pl" onclick="navigate('pl')"><span class="ic">📈</span> P&amp;L Report</button>
  <div class="sb-section">System</div>
  <button class="nav-item" data-page="settings" onclick="navigate('settings')"><span class="ic">⚙️</span> Settings</button>
</div>

<div id="main">
  <div id="topbar">
    <div class="page-title" id="page-title">Dashboard</div>
    <div class="meta">
      <span id="tb-time"></span>
      <span id="tb-shift" style="background:var(--ac);color:#fff;padding:3px 10px;border-radius:6px;font-size:12px"></span>
    </div>
  </div>
  <div id="content"></div>
</div>

<div id="toast-wrap"></div>

<div id="modal-overlay" class="overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div id="modal-box" class="modal"></div>
</div>

<div id="print-area"></div>

<script>
// ===== STATE & DB =====
let currentPage='dashboard', currentOrder=[], currentOrderType='Dine-in', currentTable='', currentPayMode='Cash', currentDiscount={val:0,type:'%'}, currentEditItem=null;
const DB={
  get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
  del:(k)=>localStorage.removeItem(k)
};

// ===== FORMAT HELPERS =====
const cfg=()=>DB.get('settings',{restaurantName:'Spice Garden Restaurant',address:'123 MG Road, Bangalore - 560001',phone:'+91 98765 43210',gstin:'29ABCDE1234F1Z5',fssai:'10020011012345',footerMsg:'Thank you! Visit Again.',sgst:2.5,cgst:2.5,currency:'₹',printerWidth:'80mm',invoicePrefix:'INV',invoiceCounter:1,openingCash:500,shiftStart:'08:00',shiftEnd:'23:00'});
const sym=()=>cfg().currency||'₹';
function fmtAmt(n){n=parseFloat(n)||0;return sym()+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtDate(d){if(!d)d=new Date();const dt=new Date(d);return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtTime(d){if(!d)d=new Date();const dt=new Date(d);return dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})}
function todayStr(){return new Date().toISOString().split('T')[0]}
function nowISO(){return new Date().toISOString()}
function pad(n,l=4){return String(n).padStart(l,'0')}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ===== TOAST =====
function toast(msg,type='ok',dur=3000){
  const w=document.getElementById('toast-wrap');
  const ic={ok:'✓',err:'✕',warn:'⚠'};
  const d=document.createElement('div');
  d.className=`toast ${type}`;
  d.innerHTML=`<span>${ic[type]||'ℹ'}</span><span>${escH(msg)}</span>`;
  w.appendChild(d);
  setTimeout(()=>{d.style.animation='slideIn .3s ease reverse';setTimeout(()=>d.remove(),300)},dur);
}

// ===== UNIQUE ID GENERATOR =====
// Uses crypto.randomUUID() when available (all modern browsers).
// Falls back to a RFC-4122 v4-compliant generator for older environments.
function uid(){
  if(typeof crypto!=='undefined'&&crypto.randomUUID) return crypto.randomUUID();
  // Fallback: manually build xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0;
    return(c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

function nextInvoice(){const s=cfg();const c=s.invoiceCounter||1;s.invoiceCounter=c+1;DB.set('settings',s);return `${s.invoicePrefix||'INV'}-${pad(c)}`}

function todayOrders(){const t=todayStr();return getOrders().filter(o=>o.date===t&&o.status!=='Cancelled')}

// ===== ORDER CALCULATIONS =====
function calcOrder(items,discount,dtype){
  const s=cfg();
  const subtotal=items.reduce((a,i)=>a+i.rate*i.qty,0);
  const sgstR=s.sgst/100,cgstR=s.cgst/100;
  let discAmt=0;
  if(discount>0){discAmt=dtype==='%'?subtotal*discount/100:discount}
  const taxBase=subtotal-discAmt;
  const sgstAmt=taxBase*sgstR,cgstAmt=taxBase*cgstR;
  const total=taxBase+sgstAmt+cgstAmt;
  return{subtotal,discAmt,sgstAmt,cgstAmt,total,sgstR:s.sgst,cgstR:s.cgst};
}

// ===== STOCK DEDUCTION =====
function deductStock(items){
  const recipes=getRecipes();
  let stock=getStock();
  let changed=false;
  items.forEach(item=>{
    const recipe=recipes[item.menuItemId]||[];
    recipe.forEach(ing=>{
      const idx=stock.findIndex(s=>s.id===ing.stockId);
      if(idx>=0){
        stock[idx].stock=Math.max(0,parseFloat(stock[idx].stock)-(parseFloat(ing.qty)*item.qty));
        changed=true;
      }
    });
  });
  if(changed)saveStock(stock);
}

// ===== SAVE ORDER =====
function saveOrder(order){
  const orders=getOrders();
  orders.unshift(order);
  saveOrders(orders);
  deductStock(order.items);
}

// ===== SALES REPORT =====
let salesDate=todayStr();
function renderSales(){
  const allOrders=getOrders();
  const orders=allOrders.filter(o=>o.date===salesDate&&o.status!=='Cancelled');
  const totalRev=orders.reduce((a,o)=>a+(o.total||0),0);
  const totalCOGS=orders.reduce((a,o)=>a+(o.cogs||0),0);
  const totalDisc=orders.reduce((a,o)=>a+(o.discAmt||0),0);
  const totalTax=orders.reduce((a,o)=>a+(o.sgstAmt||0)+(o.cgstAmt||0),0);

  // Hourly breakdown
  const hourly={};
  for(let h=0;h<24;h++)hourly[h]={count:0,rev:0};
  orders.forEach(o=>{const h=new Date(o.createdAt).getHours();hourly[h].count++;hourly[h].rev+=o.total||0});

  // Item-wise
  const itemStats={};
  orders.forEach(o=>(o.items||[]).forEach(i=>{
    if(!itemStats[i.name])itemStats[i.name]={qty:0,rev:0,cost:0};
    itemStats[i.name].qty+=i.qty;
    itemStats[i.name].rev+=i.rate*i.qty;
    itemStats[i.name].cost+=(i.cost||0)*i.qty;
  }));

  // Category-wise
  const catStats={};
  orders.forEach(o=>(o.items||[]).forEach(i=>{
    const cat=i.category||'Other';
    if(!catStats[cat])catStats[cat]={qty:0,rev:0};
    catStats[cat].qty+=i.qty;catStats[cat].rev+=i.rate*i.qty;
  }));

  // Channel-wise (Counter vs Swiggy/Zomato/Phone/Website)
  const chanStats={};
  orders.forEach(o=>{
    const ch=o.channel||'Counter';
    if(!chanStats[ch])chanStats[ch]={orders:0,rev:0,comm:0};
    chanStats[ch].orders++;chanStats[ch].rev+=o.total||0;chanStats[ch].comm+=o.commissionAmt||0;
  });
  const totalComm=orders.reduce((a,o)=>a+(o.commissionAmt||0),0);

  const topItem=Object.entries(itemStats).sort((a,b)=>b[1].rev-a[1].rev)[0];

  document.getElementById('content').innerHTML=`
<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
  <input type="date" value="${salesDate}" onchange="salesDate=this.value;renderSales()" style="padding:8px 14px;border:1.5px solid var(--bdr);border-radius:8px;font-size:14px;color:var(--txt)">
  <span style="color:var(--mut);font-size:13px">${orders.length} orders on ${fmtDate(salesDate)}</span>
  <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print Report</button>
</div>
<div class="report-cards">

let plMonth=new Date().toISOString().slice(0,7);
function renderPL(){
  const allOrders=getOrders();
  const orders=allOrders.filter(o=>o.date&&o.date.startsWith(plMonth)&&o.status!=='Cancelled');
  const totalRev=orders.reduce((a,o)=>a+(o.total||0),0);
  const totalCOGS=orders.reduce((a,o)=>a+(o.cogs||0),0);
  const grossProfit=totalRev-totalCOGS;
  const totalDisc=orders.reduce((a,o)=>a+(o.discAmt||0),0);
  const totalTax=orders.reduce((a,o)=>a+(o.sgstAmt||0)+(o.cgstAmt||0),0);
  const totalComm=orders.reduce((a,o)=>a+(o.commissionAmt||0),0);
  const netProfit=grossProfit-totalComm;

  // Daily breakdown
  const daily={};
  orders.forEach(o=>{
    const d=o.date;
    if(!daily[d])daily[d]={rev:0,cogs:0,orders:0,disc:0};
    daily[d].rev+=o.total||0;daily[d].cogs+=o.cogs||0;daily[d].orders++;daily[d].disc+=o.discAmt||0;
  });

  document.getElementById('content').innerHTML=`

  <input type="month" value="${plMonth}" onchange="plMonth=this.value;renderPL()" style="padding:8px 14px;border:1.5px solid var(--bdr);border-radius:8px;font-size:14px">

</div>
<div class="card" style="margin-bottom:20px">
  <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px dashed var(--bdr)">📊 Monthly P&L Summary</h3>
  ${[
    ['Total Revenue',totalRev,''],
    ['(-) Cost of Goods Sold',totalCOGS,'err'],
    ['= Gross Profit',grossProfit,grossProfit>=0?'ok':'err'],
    ['Gross Margin %',totalRev>0?((grossProfit/totalRev)*100).toFixed(2)+'%':'0%',''],
    ['','',''],
    ['(-) Aggregator Commission',totalComm,'err'],
    ['= Net Profit (after commission)',netProfit,netProfit>=0?'ok':'err'],
    ['Net Margin %',totalRev>0?((netProfit/totalRev)*100).toFixed(2)+'%':'0%',''],
    ['','',''],
    ['Total GST Collected',totalTax,''],
    ['Total Discount Given',totalDisc,'warn'],
  ].map(([l,v,c])=>l?`
  <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr)">
    <span style="font-size:14px;${c?'color:var(--mut)':''}">${l}</span>
    <span style="font-weight:700;font-size:15px;color:${c==='ok'?'var(--ok)':c==='err'?'var(--err)':c==='warn'?'var(--warn)':'var(--txt)'}">${typeof v==='number'?fmtAmt(v):v}</span>
  </div>`:'<div style="height:8px"></div>').join('')}
</div>
<div class="tbl-wrap" style="margin-bottom:20px">
  <div style="padding:12px 16px;border-bottom:1px solid var(--bdr);font-weight:700">📅 Daily Breakdown</div>
  <table>
    <thead><tr><th>Date</th><th>Orders</th><th>Revenue</th><th>COGS</th><th>Gross Profit</th><th>Margin</th><th>Discount</th></tr></thead>
    <tbody>
    ${Object.entries(daily).sort(([a],[b])=>a.localeCompare(b)).map(([date,v])=>{
      const prof=v.rev-v.cogs;
      return`<tr>
        <td style="font-weight:600">${fmtDate(date)}</td>
        <td>${v.orders}</td>
        <td>${fmtAmt(v.rev)}</td>
        <td>${fmtAmt(v.cogs)}</td>

// ===== DATA EXPORT / BACKUP =====
function downloadFile(filename,content,mime){
  const blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(headers,rows){
  // Prepend UTF-8 BOM so Excel reads ₹ and other characters correctly
  return '﻿'+[headers.map(csvCell).join(','),...rows.map(r=>r.map(csvCell).join(','))].join('\r\n');
}
function stamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1,2)+pad(d.getDate(),2)+'-'+pad(d.getHours(),2)+pad(d.getMinutes(),2)}

function exportBackup(){
  const keys=['menu','categories','stock','recipes','orders','settings'];
  const data={_app:'RestroGenie',_version:1,_exportedAt:nowISO()};
  keys.forEach(k=>data[k]=DB.get(k));
  downloadFile(`restrogenic-backup-${stamp()}.json`,JSON.stringify(data,null,2),'application/json');
  toast('Backup downloaded','ok');
}

function restoreBackup(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data||data._app!=='RestroGenie')throw new Error('Not a RestroGenie backup file');
      if(!confirm('This will REPLACE all current data with the backup. Continue?')){e.target.value='';return}
      ['menu','categories','stock','recipes','orders','settings'].forEach(k=>{if(data[k]!==undefined)DB.set(k,data[k])});
      toast('Backup restored! Reloading...','ok');
      setTimeout(()=>location.reload(),1200);
    }catch(err){toast('Invalid backup file: '+err.message,'err')}
  };
  reader.readAsText(file);
}

function exportOrdersCSV(){
  const orders=getOrders();
  if(!orders.length){toast('No orders to export','warn');return}
  const headers=['Invoice','Date','Time','Channel','Type','Table/Customer','Items','Subtotal','Discount','SGST','CGST','Commission','Total','COGS','Profit','Payment','Status'];
  const rows=orders.map(o=>{
    const profit=(o.total||0)-(o.cogs||0)-(o.commissionAmt||0);
    return[o.invoice,fmtDate(o.createdAt),fmtTime(o.createdAt),o.channel||'Counter',o.type||'',o.table||o.customerName||'',
      (o.items||[]).map(i=>`${i.name} x${i.qty}`).join('; '),
      (o.subtotal||0).toFixed(2),(o.discAmt||0).toFixed(2),(o.sgstAmt||0).toFixed(2),(o.cgstAmt||0).toFixed(2),
      (o.commissionAmt||0).toFixed(2),(o.total||0).toFixed(2),(o.cogs||0).toFixed(2),profit.toFixed(2),
      o.payMode||'',o.status||'Paid'];
  });
  downloadFile(`orders-${stamp()}.csv`,toCSV(headers,rows),'text/csv;charset=utf-8');
  toast(`Exported ${orders.length} orders`,'ok');
}

function exportItemSalesCSV(){
  const orders=getOrders().filter(o=>o.status!=='Cancelled');
  const stats={};
  orders.forEach(o=>(o.items||[]).forEach(i=>{
    if(!stats[i.name])stats[i.name]={cat:i.category||'',qty:0,rev:0,cost:0};
    stats[i.name].qty+=i.qty;stats[i.name].rev+=i.rate*i.qty;stats[i.name].cost+=(i.cost||0)*i.qty;
  }));
  const rows=Object.entries(stats).sort((a,b)=>b[1].rev-a[1].rev).map(([name,v])=>[
    name,v.cat,v.qty,v.rev.toFixed(2),v.cost.toFixed(2),(v.rev-v.cost).toFixed(2),
    v.rev>0?((v.rev-v.cost)/v.rev*100).toFixed(1)+'%':'0%']);
  if(!rows.length){toast('No sales to export','warn');return}
  downloadFile(`item-sales-${stamp()}.csv`,toCSV(['Item','Category','Qty Sold','Revenue','COGS','Gross Profit','Margin'],rows),'text/csv;charset=utf-8');
  toast('Item-wise sales exported','ok');
}

function exportMenuCSV(){
  const menu=getMenu();
  if(!menu.length){toast('No menu items','warn');return}
  const rows=menu.map(m=>[m.name,m.category,(m.price||0).toFixed(2),(m.cost||0).toFixed(2),
    ((m.price||0)-(m.cost||0)).toFixed(2),(m.tax||0)+'%',m.isVeg?'Veg':'Non-Veg',m.available!==false?'Available':'Unavailable']);
  downloadFile(`menu-${stamp()}.csv`,toCSV(['Item','Category','Price','Cost','Profit','GST','Type','Status'],rows),'text/csv;charset=utf-8');
  toast(`Exported ${menu.length} menu items`,'ok');
}

function exportStockCSV(){
  const stock=getStock();
  if(!stock.length){toast('No stock items','warn');return}
  const rows=stock.map(s=>{
    const curr=parseFloat(s.stock||0),min=parseFloat(s.minStock||0);
    const status=curr<=0?'Out of Stock':curr<=min?'Low':'OK';
    return[s.name,s.unit,curr.toFixed(2),min.toFixed(2),(parseFloat(s.cost)||0).toFixed(2),
      (curr*(parseFloat(s.cost)||0)).toFixed(2),s.supplier||'',status];
  });
  downloadFile(`stock-${stamp()}.csv`,toCSV(['Item','Unit','Current Stock','Min Level','Cost/Unit','Stock Value','Supplier','Status'],rows),'text/csv;charset=utf-8');
  toast(`Exported ${stock.length} stock items`,'ok');
}

function advanceOnline(invoice){
  const orders=getOrders();
  const idx=orders.findIndex(o=>o.invoice===invoice);
  if(idx<0)return;
  const o=orders[idx];
  const i=ORDER_FLOW.indexOf(o.orderStatus);
  const next=ORDER_FLOW[i+1];
  if(!next)return;
  o.orderStatus=next;
  if(next==='Delivered'){o.status='Paid';o.completedAt=nowISO()}
  saveOrders(orders);
  toast(`${invoice} → ${next}`,'ok');
  renderOnline();
}

function cancelOnline(invoice){
  if(!confirm('Cancel this online order? Stock used will be restored.'))return;
  const orders=getOrders();
  const idx=orders.findIndex(o=>o.invoice===invoice);
  if(idx<0)return;
  const o=orders[idx];
  if(o.status!=='Cancelled')restoreStock(o.items); // give stock back
  o.orderStatus='Cancelled';o.status='Cancelled';
  saveOrders(orders);
  toast(`${invoice} cancelled`,'warn');
  renderOnline();
}

function printOnlineKOT(invoice){
  const o=getOrders().find(x=>x.invoice===invoice);
  if(o)printBill(o,true);
}

// add stock back when an online order is cancelled
function restoreStock(items){
  const recipes=getRecipes();
  let stock=getStock();
  let changed=false;
  (items||[]).forEach(item=>{
    (recipes[item.menuItemId]||[]).forEach(ing=>{
      const idx=stock.findIndex(s=>s.id===ing.stockId);
      if(idx>=0){stock[idx].stock=parseFloat(stock[idx].stock)+(parseFloat(ing.qty)*item.qty);changed=true}
    });
  });
  if(changed)saveStock(stock);
}

function saveOnlineOrder(){
  if(!olCart.length){toast('Add at least one item','warn');return}
  const ch=document.getElementById('ol-channel').value;
  const disc=parseFloat(document.getElementById('ol-disc').value)||0;
  const dtype=document.getElementById('ol-disctype').value;
  const calc=calcOrder(olCart,disc,dtype);
  const cogs=olCart.reduce((a,i)=>a+(i.cost||0)*i.qty,0);
  const payRaw=document.getElementById('ol-pay').value;
  const payMode=payRaw==='COD (Cash)'?'Cash':payRaw==='Prepaid'?(ch==='Phone'?'Cash':ch):payRaw;
  const commRate=getCommissions()[ch]||0;
  const commAmt=commissionFor(ch,calc.total);
  const order={
    invoice:nextInvoice(),date:todayStr(),createdAt:nowISO(),
    channel:ch,channelOrderId:document.getElementById('ol-extid').value.trim(),
    orderStatus:'New',
    customerName:document.getElementById('ol-cname').value.trim(),
    customerPhone:document.getElementById('ol-cphone').value.trim(),
    address:document.getElementById('ol-addr').value.trim(),
    table:ch,type:'Delivery',payMode,
    items:olCart.map(i=>({...i})),
    subtotal:calc.subtotal,discAmt:calc.discAmt,discountVal:disc,discountType:dtype,
    sgstAmt:calc.sgstAmt,cgstAmt:calc.cgstAmt,total:calc.total,cogs,
    commission:commRate,commissionAmt:commAmt,
    status:(payRaw==='Prepaid'||payRaw==='UPI')?'Paid':'Unpaid'
  };
  saveOrder(order); // pushes + deducts stock now (restored if cancelled)
  closeModal();
  toast(`${order.channel} order ${order.invoice} logged`,'ok');
  olCart=[];
  renderOnline();
}

// ===== CUSTOMER SELF-ORDER (QR) PAGE =====
// Opened via ?mode=order — a customer-facing menu that drops an order into the
// Online Orders inbox (channel = Website). Same-origin/same-browser via localStorage.
let custCart=[], custCat='All';
function renderCustomerOrder(){
  const menu=getMenu().filter(m=>m.available!==false);
  const cats=['All',...getCategories()];
  const list=custCat==='All'?menu:menu.filter(m=>m.category===custCat);
  const s=cfg();
  const total=custCart.reduce((a,i)=>a+i.rate*i.qty,0);
  const count=custCart.reduce((a,i)=>a+i.qty,0);
  document.getElementById('content').style.padding='0';
  document.getElementById('content').innerHTML=`
<div style="max-width:760px;margin:0 auto;padding:16px 16px 110px">
  <div style="text-align:center;padding:18px 0 10px">
    ${s.logoB64?`<img src="${s.logoB64}" style="height:56px;margin-bottom:8px">`:''}
    <h1 style="font-size:24px;font-weight:800">${escH(s.restaurantName)}</h1>
    <p style="color:var(--mut);font-size:13px">Scan • Order • Relax 🍽️</p>
  </div>
  <div class="cat-tabs" style="position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5">
    ${cats.map(c=>`<div class="cat-tab${custCat===c?' active':''}" onclick="custCat='${escH(c)}';renderCustomerOrder()">${escH(c)}</div>`).join('')}
  </div>
  <div class="menu-grid">
    ${list.map(m=>`<div class="menu-card" onclick="custAdd('${m.id}')">
      <div style="display:flex;align-items:center;margin-bottom:6px"><div class="mc-veg ${m.isVeg?'veg':'nv'}"></div><span class="mc-cat">${escH(m.category)}</span></div>
      <div class="mc-name">${escH(m.name)}</div>
      <div class="mc-price">${fmtAmt(m.price)}</div>
    </div>`).join('')||`<div style="grid-column:1/-1;text-align:center;color:var(--mut);padding:30px">Menu coming soon</div>`}
  </div>
</div>
${count>0?`<div style="position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bdr);padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.08)">
  <div style="max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px">
    <div style="flex:1"><div style="font-size:12px;color:var(--mut)">${count} item${count>1?'s':''}</div><div style="font-weight:800;font-size:18px">${fmtAmt(total)} <small style="font-weight:400;color:var(--mut)">+ taxes</small></div></div>
    <button class="btn btn-outline" onclick="custViewCart()">View Cart</button>
    <button class="btn btn-primary" onclick="custCheckout()">Place Order →</button>
  </div>
</div>`:''}`;
}
function custAdd(id){const m=getMenu().find(x=>x.id===id);if(!m)return;const e=custCart.find(c=>c.menuItemId===id);if(e)e.qty++;else custCart.push({menuItemId:m.id,name:m.name,category:m.category,rate:parseFloat(m.price),qty:1,cost:parseFloat(m.cost||0),taxPct:parseFloat(m.tax||0)});toast(`${m.name} added`);renderCustomerOrder()}
function custViewCart(){
  if(!custCart.length){toast('Cart empty','warn');return}
  openModal(`<div class="modal-hdr"><h3>Your Order</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Amount</th><th></th></tr></thead><tbody>
  ${custCart.map((i,idx)=>`<tr><td>${escH(i.name)}</td><td>
    <button class="qty-btn minus" onclick="custQty(${idx},-1)">−</button> ${i.qty} <button class="qty-btn plus" onclick="custQty(${idx},1)">+</button>
  </td><td>${fmtAmt(i.rate*i.qty)}</td><td><button class="oi-del" onclick="custQty(${idx},-99)">✕</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Keep Adding</button><button class="btn btn-primary" onclick="closeModal();custCheckout()">Checkout →</button></div>`);
}
function custQty(idx,d){if(d===-99)custCart.splice(idx,1);else{custCart[idx].qty+=d;if(custCart[idx].qty<=0)custCart.splice(idx,1)}custCart.length?custViewCart():closeModal();renderCustomerOrder()}
function custCheckout(){
  if(!custCart.length){toast('Cart empty','warn');return}
  const calc=calcOrder(custCart,0,'%');
  openModal(`<div class="modal-hdr"><h3>Almost done 🎉</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="form-grid">
    <div class="form-group"><label>Your Name *</label><input id="cust-name" placeholder="Name"></div>
    <div class="form-group"><label>Phone *</label><input id="cust-phone" placeholder="Phone"></div>
    <div class="form-group" style="grid-column:1/-1"><label>Table No. / Delivery Address</label><input id="cust-addr" placeholder="e.g. Table 5 / 123 Main St"></div>
  </div>
  <div style="background:#f8fafc;border-radius:8px;padding:12px;margin:12px 0">
    <div class="tot-row"><span>Subtotal</span><span>${fmtAmt(calc.subtotal)}</span></div>
    <div class="tot-row"><span>Taxes</span><span>${fmtAmt(calc.sgstAmt+calc.cgstAmt)}</span></div>
    <div class="tot-row grand"><span>To Pay</span><span>${fmtAmt(calc.total)}</span></div>
  </div>
  <p style="font-size:12px;color:var(--mut);text-align:center">Pay at counter / on delivery</p>
  <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Back</button><button class="btn btn-success" onclick="custPlaceOrder()">Confirm Order ✓</button></div>`);
}
function custPlaceOrder(){
  const name=document.getElementById('cust-name').value.trim();
  const phone=document.getElementById('cust-phone').value.trim();
  if(!name||!phone){toast('Enter name and phone','err');return}
  const calc=calcOrder(custCart,0,'%');
  const cogs=custCart.reduce((a,i)=>a+(i.cost||0)*i.qty,0);
  const order={
    invoice:nextInvoice(),date:todayStr(),createdAt:nowISO(),
    channel:'Website',channelOrderId:'',orderStatus:'New',
    customerName:name,customerPhone:phone,address:document.getElementById('cust-addr').value.trim(),
    table:'Website',type:'Takeaway',payMode:'Unpaid',
    items:custCart.map(i=>({...i})),
    subtotal:calc.subtotal,discAmt:0,discountVal:0,discountType:'%',
    sgstAmt:calc.sgstAmt,cgstAmt:calc.cgstAmt,total:calc.total,cogs,
    commission:getCommissions().Website||0,commissionAmt:commissionFor('Website',calc.total),
    status:'Unpaid'
  };
  saveOrder(order);
  custCart=[];
  closeModal();
  openModal(`<div style="text-align:center;padding:20px">
    <div style="font-size:54px">✅</div>
    <h3 style="font-size:20px;margin:8px 0">Order Placed!</h3>
    <p style="color:var(--mut)">Your order <b>${order.invoice}</b> has been sent to the kitchen.</p>
    <button class="btn btn-primary" style="margin-top:16px" onclick="closeModal();renderCustomerOrder()">Order More</button>
  </div>`);
}

// ===== CLOCK & TOPBAR =====
function updateClock(){
  const now=new Date();
  document.getElementById('tb-time').textContent=`${fmtDate(now)} ${fmtTime(now)}`;
  const s=cfg();
  const startH=parseInt((s.shiftStart||'08:00').split(':')[0]);
  const endH=parseInt((s.shiftEnd||'23:00').split(':')[0]);
  const h=now.getHours();
  const inShift=h>=startH&&h<endH;
  const el=document.getElementById('tb-shift');
  el.textContent=inShift?'🟢 Shift Active':'🔴 Off Shift';
  el.style.background=inShift?'var(--ok)':'var(--mut)';
  document.getElementById('sb-date').textContent=fmtDate(now);
  updateOnlineBadge();
}

// ===== INIT =====
(function(){
  initSampleData();
  const s=cfg();
  document.getElementById('sb-rname').textContent=s.restaurantName||'RestroGenie';
  // Customer self-order (QR) mode: append ?mode=order to the URL
  const params=new URLSearchParams(location.search);
  if(params.get('mode')==='order'){
    document.getElementById('sidebar').style.display='none';
    document.getElementById('topbar').style.display='none';
    renderCustomerOrder();
    return;
  }
  updateClock();
  setInterval(updateClock,30000);
  navigate('dashboard');
})();
</script>
</body>
</html>
